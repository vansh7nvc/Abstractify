<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Glow Accents -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Header Branding -->
  <g transform="translate(80, 90)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-1">🎓 AbstractiFy</text>
    <rect x="0" y="20" width="340" height="4" fill="url(#primaryGrad)" rx="2" />
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#9ca3af">De-jargonize research. Find consensus. Map the science.</text>
  </g>

  <!-- Badges Pill -->
  <g transform="translate(850, 85)">
    <rect x="0" y="0" width="270" height="42" fill="#1f2937" rx="21" stroke="#374151" stroke-width="1" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="40" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#34d399">100% Free &amp; Open Source</text>
  </g>

  <!-- 4 Core Feature Cards Grid -->
  <!-- Card 1: Consensus Meter -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="245" height="340" fill="#131b2e" rx="16" stroke="#1e293b" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" fill="#312e81" rx="12" />
    <text x="34" y="55" font-family="system-ui, sans-serif" font-size="24">📊</text>
    <text x="20" y="110" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#ffffff">Consensus Meter</text>
    <text x="20" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" width="200">
      <tspan x="20" dy="0">Synthesises 200M+</tspan>
      <tspan x="20" dy="22">papers into clear</tspan>
      <tspan x="20" dy="22">scientific agreement</tspan>
      <tspan x="20" dy="22">percentages.</tspan>
    </text>
    <rect x="20" y="270" width="205" height="10" fill="#1e293b" rx="5" />
    <rect x="20" y="270" width="160" height="10" fill="url(#accentGrad)" rx="5" />
    <text x="20" y="305" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#38bdf8">78% Support Balance</text>
  </g>

  <!-- Card 2: Study Matrix -->
  <g transform="translate(350, 200)">
    <rect x="0" y="0" width="245" height="340" fill="#131b2e" rx="16" stroke="#1e293b" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" fill="#831843" rx="12" />
    <text x="34" y="55" font-family="system-ui, sans-serif" font-size="24">🧮</text>
    <text x="20" y="110" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#ffffff">Comparison Matrix</text>
    <text x="20" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">
      <tspan x="20" dy="0">Structured extraction</tspan>
      <tspan x="20" dy="22">of methods, outcomes,</tspan>
      <tspan x="20" dy="22">&amp; limits with CSV &amp;</tspan>
      <tspan x="20" dy="22">Markdown export.</tspan>
    </text>
    <rect x="20" y="260" width="205" height="50" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1" />
    <text x="32" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#f472b6">📄 Method | Outcome | CSV</text>
  </g>

  <!-- Card 3: Citation Network Graph -->
  <g transform="translate(620, 200)">
    <rect x="0" y="0" width="245" height="340" fill="#131b2e" rx="16" stroke="#1e293b" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" fill="#065f46" rx="12" />
    <text x="34" y="55" font-family="system-ui, sans-serif" font-size="24">🕸️</text>
    <text x="20" y="110" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#ffffff">Citation Network</text>
    <text x="20" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">
      <tspan x="20" dy="0">Interactive graph</tspan>
      <tspan x="20" dy="22">lineage analysis with</tspan>
      <tspan x="20" dy="22">Obsidian &amp; BibTeX</tspan>
      <tspan x="20" dy="22">graph exports.</tspan>
    </text>
    <!-- Mini graph node illustration -->
    <circle cx="70" cy="285" r="12" fill="#3b82f6" />
    <circle cx="140" cy="265" r="8" fill="#10b981" />
    <circle cx="170" cy="300" r="10" fill="#ec4899" />
    <line x1="70" y1="285" x2="140" y2="265" stroke="#475569" stroke-width="2" />
    <line x1="70" y1="285" x2="170" y2="300" stroke="#475569" stroke-width="2" />
  </g>

  <!-- Card 4: Equation Explainer & RAG -->
  <g transform="translate(890, 200)">
    <rect x="0" y="0" width="230" height="340" fill="#131b2e" rx="16" stroke="#1e293b" stroke-width="2" />
    <rect x="20" y="24" width="48" height="48" fill="#1e3a8a" rx="12" />
    <text x="34" y="55" font-family="system-ui, sans-serif" font-size="24">💬</text>
    <text x="20" y="110" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#ffffff">Equation RAG</text>
    <text x="20" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">
      <tspan x="20" dy="0">In-doc PDF vector</tspan>
      <tspan x="20" dy="22">chat + LaTeX math</tspan>
      <tspan x="20" dy="22">equation breakdown</tspan>
      <tspan x="20" dy="22">using Gemini AI.</tspan>
    </text>
    <rect x="20" y="260" width="190" height="50" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1" />
    <text x="32" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#a78bfa">E = mc² ➔ Explained</text>
  </g>

  <!-- Footer Tagline -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Powered by Semantic Scholar • OpenAlex • Google Gemini AI • Netlify Functions</text>
  </g>
</svg>
