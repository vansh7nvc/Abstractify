name: 📖 Documentation Improvement
description: Suggest improvements to documentation, README, or code comments.
title: "[Docs]: "
labels: ["documentation"]

body:
  - type: markdown
    attributes:
      value: |
        ## 📖 Documentation Improvement
        Help us improve the AbstractiFy documentation! Clear docs make the project accessible to everyone.

  - type: textarea
    id: what-is-wrong
    attributes:
      label: What's Wrong or Missing?
      description: Describe what documentation is incorrect, unclear, or missing.
      placeholder: "The section about X doesn't explain..."
    validations:
      required: true

  - type: textarea
    id: suggested-improvement
    attributes:
      label: Suggested Improvement
      description: How should the documentation be improved?
      placeholder: "It would be clearer if..."
    validations:
      required: true

  - type: dropdown
    id: doc-area
    attributes:
      label: Documentation Area
      description: Which documentation area is affected?
      options:
        - README.md
        - CONTRIBUTING.md
        - Issue Specifications (issues/)
        - API Documentation
        - Code Comments / JSDoc
        - Setup / Installation Guide
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context or references.
      placeholder: Links, screenshots, or examples...
    validations:
      required: false
