name: ✨ Feature Request
description: Suggest a new feature or enhancement for AbstractiFy.
title: "[Feature]: "
labels: ["enhancement"]
assignees: ["vansh7nvc"]

body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request
        We love hearing new ideas! Please describe your feature request below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Describe it clearly.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: "I would like AbstractiFy to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: "I've considered..."
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which part of AbstractiFy would this feature affect?
      options:
        - Search & Discovery
        - AI Analysis (Consensus, Comparison, Citations)
        - PDF Intelligence
        - Data Visualization
        - Export & Sharing
        - API Integration
        - UI/UX Design
        - Performance
        - Developer Experience
        - Other
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Estimated Difficulty
      description: How complex do you think this feature would be to implement?
      options:
        - Easy (few hours)
        - Medium (1-3 days)
        - Hard (1+ week)
        - "Not sure"
    validations:
      required: false

  - type: textarea
    id: mockup
    attributes:
      label: Mockups / Screenshots
      description: If you have any mockups, wireframes, or reference screenshots, attach them here.
      placeholder: Drag and drop images here...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, references, or related issues.
      placeholder: Links to related issues, papers, or APIs...
    validations:
      required: false
