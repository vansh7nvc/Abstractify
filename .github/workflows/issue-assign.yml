name: Issue Auto-Assign Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto_assign:
    name: Auto Assign Issue
    runs-on: ubuntu-latest
    if: !github.event.issue.pull_request
    steps:
      - name: 🤖 Process Comment & Auto-Assign
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment.body.toLowerCase();
            const triggers = ['assign me', "i'd like to work on this", 'i want to work on this', 'claim', 'please assign me'];
            
            const isTriggered = triggers.some(t => comment.includes(t));
            if (!isTriggered) return;

            const issue = context.payload.issue;
            const commenter = context.payload.comment.user.login;

            if (issue.assignees && issue.assignees.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Hi @${commenter}, this issue is already assigned to @${issue.assignees[0].login}. Check out other open issues labeled [\`good first issue\`](https://github.com/${context.repo.owner}/${context.repo.repo}/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22)! 🎓`
              });
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [commenter]
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🎉 **Awesome @${commenter}!** This issue is now assigned to you.\n\n- Please read our [CONTRIBUTING.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md) guide before submitting your PR.\n- If you need help, feel free to ask questions right here.\n\nHappy coding! 🎓✨`
            });
