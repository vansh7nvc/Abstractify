name: Stale Issues & PRs

on:
  schedule:
    - cron: '30 1 * * *' # Run daily at 1:30 AM UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark & Close Stale Items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            👋 This issue has been automatically marked as **stale** because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
            If this issue is still relevant, please comment to keep it open.
            Thank you for contributing to AbstractiFy! 🎓
          stale-pr-message: >
            👋 This pull request has been automatically marked as **stale** because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
            Please update your PR or comment to keep it open.
          close-issue-message: >
            🔒 This issue was closed because it has been stale for 7 days with no activity.
            Feel free to reopen if the issue is still relevant.
          close-pr-message: >
            🔒 This pull request was closed because it has been stale for 7 days with no activity.
            Feel free to reopen and update when ready.
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,help wanted,good first issue'
          exempt-pr-labels: 'pinned,security,work in progress'
